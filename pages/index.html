<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssignmentHub | Pages Demo</title><style>body{margin:0;background:#f4f7fc;color:#19314f;font-family:Segoe UI,Arial,sans-serif}header{background:#fff;border-bottom:1px solid #e0e6f1;padding:22px max(20px,calc((100vw - 900px)/2));font-size:24px;font-weight:800}header span,h1 em{color:#3b62de;font-style:normal}main{max-width:900px;margin:50px auto;padding:0 20px}h1{font-size:42px;letter-spacing:-2px}p{color:#728096}section{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px #202a4410}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #dce4f1;border-radius:8px}button{border:0;padding:13px;width:100%;margin-top:20px;background:#3b62de;color:white;border-radius:9px;cursor:pointer}ul{padding-left:20px}li{margin:14px 0;overflow-wrap:anywhere}a{color:#3b62de}#error{color:#b32a42}small{font-size:12px;color:#728096}@media(max-width:650px){section{grid-template-columns:1fr}h1{font-size:33px}}</style></head><body><header>✦ Assignment<span>Hub</span></header><main><small>CSC418 · GITHUB PAGES STATIC DEMO</small><h1>Submit your work. <em>Stay organized.</em></h1><p>This is the bonus static demonstration. It stores submissions in this browser only (localStorage). The main Flask portal uses SQLite.</p><section><div class="card"><h2>New submission</h2><form id="form"><label>Student name</label><input id="name" required><label>Registration number</label><input id="reg" required><label>Assignment title</label><input id="title" required><label>Submission URL</label><input id="url" type="url" required><div id="error" role="alert"></div><button>Submit assignment →</button></form></div><div class="card"><h2>Saved submissions</h2><p id="count">0 submissions in this browser</p><ul id="items"></ul></div></section></main><script>
const key='assignmenthub-pages-submissions';
function get(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}
function render(){let submissions=get();document.getElementById('count').textContent=submissions.length+' submissions in this browser';let list=document.getElementById('items');list.replaceChildren();submissions.forEach(s=>{let li=document.createElement('li');let strong=document.createElement('strong');strong.textContent=s.title+' · '+s.name+' ('+s.reg+')';let link=document.createElement('a');link.href=s.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Open submission ↗';li.append(strong,document.createElement('br'),link);list.append(li)})}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let name=document.getElementById('name').value.trim(),reg=document.getElementById('reg').value.trim(),title=document.getElementById('title').value.trim(),url=document.getElementById('url').value.trim(),error=document.getElementById('error');error.textContent='';let parsed;try{parsed=new URL(url)}catch{}if(!name||!reg||!title||!parsed||!['https:','http:'].includes(parsed.protocol)||!parsed.hostname||/\s/.test(url)){error.textContent='All fields and a valid http(s) URL are required.';return}let data=get();data.unshift({name,reg,title,url});localStorage.setItem(key,JSON.stringify(data));e.target.reset();render()});render();
</script></body></html>
